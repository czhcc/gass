services:
  studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: graph-agent-simulation-studio:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:?Set an initial admin password}
      STUDIO_COOKIE_SECURE: ${STUDIO_COOKIE_SECURE:-true}
    volumes:
      - studio-data:/data
    restart: unless-stopped
volumes:
  studio-data:
