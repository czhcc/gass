spring:
  application:
    name: graph-agent-simulation-studio
  profiles:
    default: dev
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA foreign_keys=ON;"
      data-source-properties:
        foreign_keys: true
        journal_mode: WAL
        busy_timeout: 5000
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

studio:
  simulation:
    max-decisions: 50
    max-model-requests: 300
    enforce-output-token-budget: false
    max-generated-tokens: 307200
    max-runtime-seconds: 600
    max-state-changes: 50
