spring:
  application:
    name: graph-agent-simulation-studio
  profiles:
    default: dev
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
